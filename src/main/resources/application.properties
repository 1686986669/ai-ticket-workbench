server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/tickets}
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
ai.mode=${AI_MODE:demo}
ai.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
ai.api-key=${LLM_API_KEY:}
ai.model=${LLM_MODEL:}
server.error.include-message=never
