<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1290" viewBox="0 0 1200 1290" role="img"><title>Java AI 工单工作台</title><desc>实测路径：真实 HTTP → Spring Boot → MyBatis → H2；规则建议</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#586b87"/></marker></defs>
<rect width="1200" height="1290" fill="#f5f7fb"/>
